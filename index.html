<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會考社會科複習站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC;
    --bg-line: rgba(33,38,47,0.035);
    --ink:#21262F;
    --ink-soft:#5B6472;
    --card:#FFFFFF;
    --hist:#7A3B2E;   --hist-soft:#F1E3DD;
    --geo:#1F5C3A;    --geo-soft:#DDEDE2;
    --civ:#1F4A7A;    --civ-soft:#DEE8F5;
    --gold:#A9791C;   --gold-soft:#FBF0D6;
    --red:#B23B3B;    --red-soft:#FBE7E7;
    --green-ok:#2E7D4F; --green-soft:#E4F3EA;
    --accent: var(--hist);
    --accent-soft: var(--hist-soft);
    --radius: 10px;
    --shadow: 0 1px 2px rgba(33,38,47,0.06), 0 4px 14px rgba(33,38,47,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, var(--bg-line) 0px, var(--bg-line) 1px, transparent 1px, transparent 34px),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:"Noto Serif TC","Noto Sans TC",serif; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background: var(--gold-soft); }

  /* ---------- App shell ---------- */
  #app{ max-width:1180px; margin:0 auto; padding:18px 16px 60px 16px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 18px; background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:16px; flex-wrap:wrap;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .topbar .brand .mark{
    width:38px; height:38px; border-radius:9px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700;
    font-family:"Noto Serif TC",serif; flex-shrink:0;
  }
  .topbar .brand .ttl{ font-size:17px; font-weight:700; line-height:1.2; }
  .topbar .brand .sub{ font-size:11px; color:var(--ink-soft); }
  .progress-dash{ display:flex; gap:14px; flex-wrap:wrap; }
  .pd-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .pd-item .dots{ display:flex; gap:3px; }
  .pd-dot{ width:8px; height:8px; border-radius:50%; background:#E4E0D4; }
  .pd-dot.on{ background: var(--dotcolor,#999); }

  /* ---------- Layout: rail + main ---------- */
  .layout{ display:flex; gap:18px; align-items:flex-start; }
  .rail{
    width:200px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;
    position:sticky; top:16px;
  }
  .tab{
    display:flex; align-items:center; gap:10px; padding:13px 14px;
    background:var(--card); border-radius:8px 14px 14px 8px; border-left:6px solid transparent;
    box-shadow:var(--shadow); font-size:14px; font-weight:700; color:var(--ink-soft);
    transform:translateX(0); transition:transform .15s ease;
    position:relative;
  }
  .tab .ic{ font-size:18px; }
  .tab.active{ transform:translateX(6px); color:var(--ink); }
  .tab[data-subj="history"].active{ border-color:var(--hist); background:var(--hist-soft); }
  .tab[data-subj="geography"].active{ border-color:var(--geo); background:var(--geo-soft); }
  .tab[data-subj="civics"].active{ border-color:var(--civ); background:var(--civ-soft); }
  .tab .badge{
    margin-left:auto; font-size:10px; padding:2px 6px; border-radius:8px; background:#EEEAE0; color:var(--ink-soft);
    font-weight:700;
  }
  .tab.active .badge{ background:rgba(255,255,255,0.65); }

  .rail-panel{ background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:12px; }
  .rail-panel h4{ margin:2px 0 8px 0; font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .level-switch{ display:flex; background:#EFEBE0; border-radius:999px; padding:3px; margin-bottom:10px; }
  .level-switch button{
    flex:1; border:none; background:transparent; padding:7px 0; font-size:12.5px; font-weight:700;
    border-radius:999px; color:var(--ink-soft);
  }
  .level-switch button.active{ background:var(--ink); color:#fff; }
  .mode-switch{ display:flex; flex-direction:column; gap:6px; }
  .mode-switch button{
    text-align:left; border:1.5px solid #E7E2D4; background:#fff; padding:9px 10px; border-radius:8px;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:8px;
  }
  .mode-switch button.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .challenge-btn{
    margin-top:8px; width:100%; border:none; border-radius:8px; padding:10px; font-size:12.5px; font-weight:700;
    background:var(--ink); color:#fff;
  }

  .main{ flex:1; min-width:0; }

  /* ---------- Home ---------- */
  .home-hero{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:26px 26px 22px 26px; margin-bottom:16px;
  }
  .home-hero h1{ font-size:24px; margin:0 0 6px 0; }
  .home-hero p{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; max-width:62ch; margin:0 0 14px 0; }
  .home-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .home-card{
    border-radius:12px; padding:14px; color:#fff; cursor:pointer; border:none; text-align:left;
    display:flex; flex-direction:column; gap:4px; transition:transform .12s ease;
  }
  .home-card:hover{ transform:translateY(-2px); }
  .home-card.hist{ background:linear-gradient(135deg,var(--hist),#5a2b21); }
  .home-card.geo{ background:linear-gradient(135deg,var(--geo),#153f28); }
  .home-card.civ{ background:linear-gradient(135deg,var(--civ),#153154); }
  .home-card .hc-ic{ font-size:22px; }
  .home-card .hc-ttl{ font-size:15px; font-weight:700; }
  .home-card .hc-desc{ font-size:11.5px; opacity:.9; }

  /* ---------- Content cards (review) ---------- */
  .section-head{
    display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px 0; flex-wrap:wrap; gap:8px;
  }
  .section-head h2{ font-size:19px; margin:0; }
  .section-head .tag{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; background:var(--accent);
  }
  .topic{
    background:var(--card); border-radius:12px; box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden;
  }
  .topic summary{
    list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:14px; border-left:5px solid var(--accent);
  }
  .topic summary::-webkit-details-marker{ display:none; }
  .topic summary .num{
    width:22px; height:22px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; flex-shrink:0;
  }
  .topic summary .chev{ margin-left:auto; color:var(--ink-soft); transition:transform .15s ease; font-size:12px;}
  .topic[open] summary .chev{ transform:rotate(180deg); }
  .topic .body{ padding:2px 18px 16px 41px; font-size:13px; line-height:1.75; color:var(--ink); }
  .topic .body table{ width:100%; border-collapse:collapse; margin:8px 0 12px 0; font-size:12.3px; }
  .topic .body th,.topic .body td{ border:1px solid #E4E0D2; padding:6px 8px; text-align:left; vertical-align:top; }
  .topic .body th{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .topic .body ul{ margin:4px 0 8px 0; padding-left:19px; }
  .topic .body li{ margin:3px 0; }
  .callout{ border-radius:8px; padding:9px 12px; margin:8px 0; font-size:12.3px; }
  .callout.tip{ background:var(--gold-soft); border:1px solid #E6D18C; }
  .callout.tip b{ color:var(--gold); }
  .callout.warn{ background:var(--red-soft); border:1px solid #EAB3B3; }
  .callout.warn b{ color:var(--red); }
  .callout.fix{ background:#F1E7FA; border:1px solid #D3B5EC; }
  .callout.fix b{ color:#6A3B94; }

  /* ---------- Quiz ---------- */
  .quiz-wrap{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:22px; }
  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .quiz-top .qcount{ font-size:12px; color:var(--ink-soft); font-weight:700; }
  .bubble-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .bubble{
    width:22px; height:22px; border-radius:50%; border:2px solid #DCD6C6; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:var(--ink-soft); background:#fff;
  }
  .bubble.current{ border-color:var(--accent); color:var(--accent); }
  .bubble.correct{ background:var(--green-ok); border-color:var(--green-ok); color:#fff; }
  .bubble.wrong{ background:var(--red); border-color:var(--red); color:#fff; }
  .q-card .q-level{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); margin-bottom:10px;
  }
  .q-card h3{ font-size:16.5px; margin:0 0 16px 0; line-height:1.6; }
  .opt-list{ display:flex; flex-direction:column; gap:9px; margin-bottom:6px; }
  .opt{
    display:flex; align-items:center; gap:10px; text-align:left; padding:11px 14px; border-radius:9px;
    border:1.6px solid #E4E0D2; background:#fff; font-size:13.5px; color:var(--ink);
  }
  .opt .letter{
    width:22px; height:22px; border-radius:50%; border:1.6px solid #C9C3B2; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; color:var(--ink-soft);
  }
  .opt:not(.locked):hover{ border-color:var(--accent); }
  .opt.locked{ cursor:default; }
  .opt.correct-answer{ border-color:var(--green-ok); background:var(--green-soft); }
  .opt.correct-answer .letter{ background:var(--green-ok); border-color:var(--green-ok); color:#fff; }
  .opt.wrong-answer{ border-color:var(--red); background:var(--red-soft); }
  .opt.wrong-answer .letter{ background:var(--red); border-color:var(--red); color:#fff; }
  .explain-box{
    margin-top:14px; padding:12px 14px; border-radius:9px; background:#F7F5EE; border:1px dashed #D8D2C0;
    font-size:12.6px; line-height:1.7; color:var(--ink-soft);
  }
  .explain-box b{ color:var(--ink); }
  .quiz-actions{ display:flex; justify-content:flex-end; margin-top:16px; }
  .btn-primary{
    border:none; background:var(--ink); color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:700;
  }
  .btn-primary:disabled{ opacity:.35; }
  .btn-ghost{
    border:1.5px solid #DDD7C7; background:transparent; color:var(--ink-soft); padding:9px 18px; border-radius:8px;
    font-size:13px; font-weight:700;
  }
  .quiz-result{ text-align:center; padding:20px 10px; }
  .quiz-result .score{ font-family:"Noto Serif TC",serif; font-size:46px; font-weight:900; color:var(--accent); margin:6px 0; }
  .quiz-result .msg{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  footer{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:26px; }

  @media (max-width:820px){
    .layout{ flex-direction:column; }
    .rail{ width:100%; flex-direction:row; flex-wrap:wrap; position:static; }
    .tab{ flex:1 1 30%; border-radius:10px; border-left:none; border-bottom:5px solid transparent; }
    .tab.active{ transform:none; }
    .rail-panel{ width:100%; order:3; }
    .home-grid{ grid-template-columns:1fr; }
    .topic .body{ padding-left:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   內容資料：歷史 / 地理 / 公民 × 基礎 / 進階
   ============================================================ */
const CONTENT = {
history: {
  label:"歷史", icon:"📜", key:"history",
  basic:[
    {t:"史前時代分期", h:`
      <table><tr><th>時期</th><th>代表文化</th><th>年代</th><th>特色</th></tr>
      <tr><td>舊石器</td><td>長濱文化（臺東）</td><td>約5萬〜5千年前</td><td>打製石器、採集狩獵、居洞穴</td></tr>
      <tr><td>新石器</td><td>大坌坑→圓山→卑南文化</td><td>約7千〜2千年前</td><td>磨製石器、製陶、定居農耕</td></tr>
      <tr><td>金屬器</td><td>十三行文化（八里）</td><td>約2千〜4百年前</td><td>使用鐵器、對外貿易</td></tr></table>
      <div class="callout tip">🔑必考：<b>長濱＝最早、打製石器；十三行＝最晚、鐵器、有對外貿易。</b></div>`},
    {t:"臺灣原住民族", h:`
      <ul><li>屬於「<b>南島語族</b>」的一支，語言文化與太平洋、印度洋島嶼有共通性。</li>
      <li>政府認定16族，如阿美、泰雅、排灣、布農、卑南、達悟等。</li>
      <li>多數行<b>父系社會</b>（泰雅、布農），部分行<b>母系社會</b>（阿美、卑南），排灣、魯凱有<b>貴族與平民</b>階級制。</li></ul>
      <div class="callout warn">⚠️易混淆：<b>阿美族＝母系＋年齡階級；達悟族＝唯一分布離島（蘭嶼）、無獵頭與階級。</b></div>`},
    {t:"大航海時代（荷西時期）", h:`
      <table><tr><th>國家</th><th>統治重心</th><th>主要作為</th></tr>
      <tr><td>荷蘭</td><td>臺南（熱蘭遮城）</td><td>王田制、獎勵漢人開墾、貿易轉口站</td></tr>
      <tr><td>西班牙</td><td>雞籠、淡水</td><td>以傳教貿易為主，規模較小，1642被荷蘭逐出</td></tr></table>`},
    {t:"鄭氏治臺時期（1661–1683）", h:`
      <ul><li><b>鄭成功</b>擊敗荷蘭，改臺灣為「東都」，作為反清復明基地。</li>
      <li><b>鄭經</b>改「東寧」，行「寓兵於農」<b>屯田制</b>，陳永華建議設學校、行科舉。</li>
      <li>1683年清將<b>施琅</b>攻臺，鄭克塽投降，臺灣納入清帝國版圖。</li></ul>
      <div class="callout tip">🔑必考：陳永華＝建孔廟、辦教育、行科舉，人稱「臺灣孔子」。</div>`},
    {t:"清帝國統治政策演變＋劉銘傳建設", h:`
      <table><tr><th>階段</th><th>時間</th><th>重點</th></tr>
      <tr><td>消極治臺</td><td>1683～1860</td><td>渡臺禁令、行政簡單、分類械鬥頻繁</td></tr>
      <tr><td>開港通商後</td><td>1860～1874</td><td>開放通商口岸，茶糖樟腦外銷</td></tr>
      <tr><td>積極治臺</td><td>1874～1895</td><td>開山撫番、1885建省，劉銘傳推洋務新政</td></tr></table>
      <ul><li>劉銘傳：興建<b>基隆—新竹鐵路</b>、架電報線、清查田賦、設西學堂。</li></ul>`},
    {t:"重要事件比較", h:`
      <table><tr><th>事件</th><th>年代</th><th>影響</th></tr>
      <tr><td>牡丹社事件</td><td>1874</td><td>促成清廷開山撫番、積極治臺</td></tr>
      <tr><td>中法戰爭</td><td>1884〜85</td><td>促成臺灣建省（1885）</td></tr>
      <tr><td>甲午戰爭</td><td>1894〜95</td><td>戰敗簽<b>馬關條約</b>，割讓臺灣</td></tr></table>
      <div class="callout warn">⚠️牡丹社事件促成「建省背景」，甲午戰爭才是導致「割臺」的原因，順序勿顛倒。</div>`},
    {t:"日本殖民統治三階段", h:`
      <table><tr><th>階段</th><th>重點</th></tr>
      <tr><td>1895–1919 武力鎮壓</td><td>總督由軍人擔任，武力鎮壓抗日</td></tr>
      <tr><td>1919–1937 內地延長</td><td>改派文官總督，社會運動興起</td></tr>
      <tr><td>1937–1945 皇民化</td><td>推行說日語、改姓名，戰時徵兵</td></tr></table>`},
    {t:"社會與政治運動", h:`
      <table><tr><th>事件</th><th>人物</th><th>訴求</th></tr>
      <tr><td>臺灣議會設置請願運動</td><td>林獻堂</td><td>爭取設置民選議會，前後請願15次</td></tr>
      <tr><td>臺灣文化協會</td><td>蔣渭水、林獻堂</td><td>講習會、讀報社，啟發民智</td></tr></table>
      <div class="callout tip">🔑蔣渭水有「臺灣新文化運動之父」之稱。</div>`}
  ],
  advanced:[
    {t:"政權統治全面比較表", h:`
      <table><tr><th>面向</th><th>荷蘭</th><th>西班牙</th><th>鄭氏</th><th>清</th><th>日</th></tr>
      <tr><td>年代</td><td>1624–62</td><td>1626–42</td><td>1661–83</td><td>1683–1895</td><td>1895–1945</td></tr>
      <tr><td>重心</td><td>臺南</td><td>雞籠淡水</td><td>臺南</td><td>全臺</td><td>臺北</td></tr>
      <tr><td>結束原因</td><td>鄭成功攻臺</td><td>被荷蘭逐出</td><td>施琅攻臺</td><td>馬關條約割臺</td><td>二戰投降</td></tr></table>
      <div class="callout fix">🛠常見錯誤更正：<b>西班牙（共16年）遠短於荷蘭（共38年）</b>，且是被荷蘭趕走，不是自己撤退。</div>`},
    {t:"渡臺禁令與行政區劃演變", h:`
      <ul><li>渡臺禁令三限制：須申請許可、不准攜眷、粵民限制更嚴。</li>
      <li>造成「有唐山公、無唐山媽」現象，早期移民與平埔族通婚。</li></ul>
      <p><b>行政區劃：</b>1684 一府三縣 → 1875 二府八縣四廳 → 1885 福建臺灣省</p>
      <div class="callout warn">⚠️情境應用：「清代前期因祖籍不同發生武力衝突」→對應「分類械鬥」，非牡丹社事件。</div>`},
    {t:"日治時期的路線分裂", h:`
      <table><tr><th>團體</th><th>人物</th><th>主張</th></tr>
      <tr><td>文協（右派）</td><td>林獻堂、蔡培火</td><td>持續議會請願，體制內合法抗爭</td></tr>
      <tr><td>文協（左派）</td><td>連溫卿、王敏川</td><td>1927年改組後掌握協會，路線激進</td></tr>

  {q:"新竹科學園區發展半導體產業的重要區位因素是？", o:["鄰近清華大學與交通大學","鄰近臺灣大學","鄰近港口","地價最便宜"], a:0, e:"科學園區高度依賴鄰近大學與研究機構提供的技術人才與知識支援。"},
  {q:"日治時期會社製糖業集中於哪個區域，與其氣候地形密切相關？", o:["北部臺北盆地","南部嘉南平原","東部花東縱谷","中部臺中盆地"], a:1, e:"南部嘉南平原氣候溫暖、地勢平坦，適合甘蔗生長，帶動製糖業集中於此。"}
],
civics_basic:[
  {q:"馬斯洛需求層次理論由低到高，最先被滿足的需求是？", o:["自我實現需求","安全需求","生理需求","尊重需求"], a:2, e:"需求層次由下而上依序為：生理→安全→愛與隸屬→尊重→自我實現。"},
  {q:"下列何者不是家庭的主要功能？", o:["生育與保護","經濟","立法","情感支持"], a:2, e:"立法是政府機關的職權，不屬於家庭的功能。"},
  {q:"依接觸方式分類，「班級」屬於？", o:["初級團體","次級團體","正式團體專屬","非正式團體專屬"], a:0, e:"班級成員面對面互動、情感較親密，屬於初級團體。"},
  {q:"我國法律位階由高至低排列，下列何者正確？", o:["法律＞憲法＞命令＞地方自治法規","憲法＞法律＞命令＞地方自治法規","命令＞法律＞憲法＞地方自治法規","憲法＞命令＞法律＞地方自治法規"], a:1, e:"法律位階：憲法＞法律＞命令＞地方自治法規，下位不得牴觸上位。"},
  {q:"未滿14歲之人觸犯刑罰法律，依刑法規定？", o:["不罰","得減輕其刑","罰鍰","須入獄"], a:0, e:"未滿14歲屬無刑事責任能力，依法不罰，改依少年保護事件處理。"},
  {q:"網路購物的七天猶豫期又稱為？", o:["試用期","鑑賞期","保固期","免責期"], a:1, e:"七天猶豫期又稱鑑賞期，目的在讓消費者檢視商品，並非試用期。"}
],
civics_advanced:[
  {q:"未滿7歲之人單獨簽訂的契約，效力為？", o:["有效","效力未定","無效","得撤銷"], a:2, e:"未滿7歲屬無行為能力人，其法律行為自始、當然、確定不生效力（無效）。"},
  {q:"限制行為能力人（7〜未滿18歲）未經法定代理人允許簽訂的較大額契約，效力為？", o:["無效","效力未定","有效","得撤銷"], a:1, e:"效力未定：是否生效取決於法定代理人事後是否承認。"},
  {q:"依現行民法規定，完全行為能力的年齡自2023年起為？", o:["16歲","18歲","20歲","22歲"], a:1, e:"民法成年年齡自2023年1月1日起由20歲下修為18歲。"},
  {q:"「未滿14歲，已有觸犯刑罰法律行為」的少年稱為？", o:["曝險少年","觸法少年","限制行為能力人","累犯少年"], a:1, e:"觸法少年指未滿14歲、已有觸犯刑罰法律行為者，因未達刑事責任年齡不罰。"},
  {q:"「經常逃學逃家、無正當理由攜帶危險器械」但尚未觸法的少年稱為？", o:["觸法少年","曝險少年","更生少年","限制行為能力人"], a:1, e:"曝險少年指雖未觸法，但有觸法之虞，經評估後給予輔導或轉介福利服務。"},
  {q:"定型化契約中，若條款顯失公平，該部分條款的效力為？", o:["一律有效","可能無效","自動使契約全部無效","需雙方另立新約"], a:1, e:"定型化契約中顯失公平的條款，該部分條款可能被認定無效，其餘部分仍可能有效。"}
]
};

/* ============================================================
   應用狀態與渲染
   ============================================================ */
const state = {
  view:"home",          // home | review | quiz | quizresult
  subject:"history",
  level:"basic",
  quizKey:null,
  quizQs:[],
  quizIdx:0,
  quizAnswers:[],        // per question: null | {picked, correct}
  progress:{}            // key -> {correct,total}
};

const SUBJECT_ORDER = ["history","geography","civics"];
const ACCENT = { history:"var(--hist)", geography:"var(--geo)", civics:"var(--civ)" };
const ACCENT_SOFT = { history:"var(--hist-soft)", geography:"var(--geo-soft)", civics:"var(--civ-soft)" };

function progressKey(subj, level){ return subj+"_"+level; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(subj, level){
  const key = progressKey(subj, level);
  state.view="quiz"; state.subject=subj; state.level=level; state.quizKey=key;
  state.quizQs = QUIZZES[key].map(q=>({...q}));
  state.quizIdx = 0;
  state.quizAnswers = new Array(state.quizQs.length).fill(null);
  render();
}

function startChallenge(){
  let pool = [];
  Object.keys(QUIZZES).forEach(k=>{
    QUIZZES[k].forEach(q=> pool.push({...q, srcKey:k}));
  });
  pool = shuffle(pool).slice(0,10);
  state.view="quiz"; state.quizKey="__challenge__";
  state.quizQs = pool; state.quizIdx = 0;
  state.quizAnswers = new Array(pool.length).fill(null);
  render();
}

function pickAnswer(optIdx){
  const q = state.quizQs[state.quizIdx];
  if(state.quizAnswers[state.quizIdx]) return; // already answered
  state.quizAnswers[state.quizIdx] = { picked:optIdx, correct: optIdx===q.a };
  render();
}

function nextQuestion(){
  if(state.quizIdx < state.quizQs.length-1){
    state.quizIdx++;
    render();
  } else {
    // finish quiz -> record progress (only for non-challenge)
    const correctCount = state.quizAnswers.filter(x=>x && x.correct).length;
    if(state.quizKey !== "__challenge__"){
      const prev = state.progress[state.quizKey];
      if(!prev || correctCount > prev.correct){
        state.progress[state.quizKey] = { correct: correctCount, total: state.quizQs.length };
      }
    }
    state.view = "quizresult";
    state.lastScore = { correct: correctCount, total: state.quizQs.length };
    render();
  }
}

function goHome(){ state.view="home"; render(); }
function goReview(subj, level){ state.view="review"; state.subject=subj; state.level=level; render(); }
function setSubject(s){ state.subject=s; if(state.view==="home") state.view="review"; render(); }
function setLevel(l){ state.level=l; render(); }

/* ---------- Render functions ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topBarHTML() + `<div class="layout">` + railHTML() + `<div class="main">` + mainHTML() + `</div></div>` + footerHTML();
  bindEvents();
  document.documentElement.style.setProperty('--accent', ACCENT[state.subject] || 'var(--hist)');
  document.documentElement.style.setProperty('--accent-soft', ACCENT_SOFT[state.subject] || 'var(--hist-soft)');
}

function totalProgressDots(subj){
  const b = state.progress[progressKey(subj,"basic")];
  const a = state.progress[progressKey(subj,"advanced")];
  const bOn = b ? Math.round((b.correct/b.total)*3) : 0;
  const aOn = a ? Math.round((a.correct/a.total)*3) : 0;
  return {bOn, aOn};
}

function topBarHTML(){
  const dashes = SUBJECT_ORDER.map(s=>{
    const c = CONTENT[s];
    const {bOn,aOn} = totalProgressDots(s);
    const color = s==="history" ? "#7A3B2E" : s==="geography" ? "#1F5C3A" : "#1F4A7A";
    let dotsHtml = "";
    for(let i=0;i<3;i++) dotsHtml += `<span class="pd-dot ${i<bOn?'on':''}" style="--dotcolor:${color}"></span>`;
    dotsHtml += `<span style="width:4px;"></span>`;
    for(let i=0;i<3;i++) dotsHtml += `<span class="pd-dot ${i<aOn?'on':''}" style="--dotcolor:${color}"></span>`;
    return `<div class="pd-item">${c.icon} ${c.label} <span class="dots">${dotsHtml}</span></div>`;
  }).join("");
  return `
  <div class="topbar">
    <div class="brand">
      <div class="mark">會</div>
      <div>
        <div class="ttl">會考社會科複習站</div>
        <div class="sub">第一、二冊｜歷史・地理・公民｜基礎＋進階</div>
      </div>
    </div>
    <div class="progress-dash">${dashes}</div>
  </div>`;
}

function railHTML(){
  const tabs = SUBJECT_ORDER.map(s=>{
    const c = CONTENT[s];
    const active = state.subject===s ? "active":"";
    const {bOn,aOn} = totalProgressDots(s);
    const done = bOn===3 && aOn===3 ? "✓" : "";
    return `<button class="tab ${active}" data-subj="${s}" data-action="subject">
      <span class="ic">${c.icon}</span> ${c.label} <span class="badge">${done||((bOn+aOn)+"/6")}</span>
    </button>`;
  }).join("");

  let panel = "";
  if(state.view!=="home"){
    panel = `
    <div class="rail-panel">
      <h4>難度</h4>
      <div class="level-switch">
        <button data-action="level" data-level="basic" class="${state.level==='basic'?'active':''}">基礎</button>
        <button data-action="level" data-level="advanced" class="${state.level==='advanced'?'active':''}">進階</button>
      </div>
      <h4>模式</h4>
      <div class="mode-switch">
        <button data-action="mode" data-mode="review" class="${state.view==='review'?'active':''}">📖 重點複習</button>
        <button data-action="mode" data-mode="quiz" class="${state.view==='quiz'||state.view==='quizresult'?'active':''}">📝 小測驗</button>
      </div>
      <button class="challenge-btn" data-action="challenge">🎲 綜合挑戰（10題隨機）</button>
    </div>`;
  } else {
    panel = `
    <div class="rail-panel">
      <h4>快速開始</h4>
      <button class="challenge-btn" data-action="challenge">🎲 綜合挑戰（10題隨機）</button>
    </div>`;
  }

  return `<div class="rail">${tabs}${panel}</div>`;
}

function mainHTML(){
  if(state.view==="home") return homeHTML();
  if(state.view==="review") return reviewHTML();
  if(state.view==="quiz") return quizHTML();
  if(state.view==="quizresult") return quizResultHTML();
  return "";
}

function homeHTML(){
  const cards = SUBJECT_ORDER.map(s=>{
    const c = CONTENT[s];
    const cls = s==="history"?"hist":s==="geography"?"geo":"civ";
    return `<button class="home-card ${cls}" data-action="gohome-subject" data-subj="${s}">
      <div class="hc-ic">${c.icon}</div>
      <div class="hc-ttl">${c.label}篇</div>
      <div class="hc-desc">基礎 ${c.basic.length} 主題・進階 ${c.advanced.length} 主題</div>
    </button>`;
  }).join("");
  return `
  <div class="home-hero">
    <h1>掌握觀念，懂得運用</h1>
    <p>本站涵蓋國中教育會考社會科第一、二冊範圍，分成「基礎篇」與「進階篇」。左側選擇科目與難度，右側切換「重點複習」或「小測驗」；答錯不扣分，重點是搞懂觀念與情境判斷。準備好了嗎？</p>
    <div class="home-grid">${cards}</div>
  </div>`;
}

function reviewHTML(){
  const c = CONTENT[state.subject];
  const topics = c[state.level];
  const levelLabel = state.level==="basic" ? "基礎" : "進階";
  const items = topics.map((t,i)=>`
    <details class="topic" ${i===0?"open":""}>
      <summary><span class="num">${i+1}</span> ${t.t} <span class="chev">▾</span></summary>
      <div class="body">${t.h}</div>
    </details>`).join("");
  return `
  <div class="section-head">
    <h2>${c.icon} ${c.label}篇 － ${levelLabel}</h2>
    <span class="tag">${topics.length} 個主題</span>
  </div>
  ${items}`;
}

function quizHTML(){
  const q = state.quizQs[state.quizIdx];
  const answered = state.quizAnswers[state.quizIdx];
  const letters = ["A","B","C","D"];
  const isChallenge = state.quizKey === "__challenge__";
  const levelTag = isChallenge ? (q.srcKey && q.srcKey.includes("advanced") ? "進階" : "基礎") : (state.level==="basic"?"基礎":"進階");

  const bubbles = state.quizQs.map((_,i)=>{
    const ans = state.quizAnswers[i];
    let cls = i===state.quizIdx ? "current" : "";
    if(ans) cls = ans.correct ? "correct" : "wrong";
    return `<div class="bubble ${cls}">${i+1}</div>`;
  }).join("");

  const opts = q.o.map((opt,i)=>{
    let cls="opt";
    if(answered){
      cls += " locked";
      if(i===q.a) cls += " correct-answer";
      else if(i===answered.picked) cls += " wrong-answer";
    }
    return `<button class="${cls}" data-action="pick" data-idx="${i}" ${answered?"disabled":""}>
      <span class="letter">${letters[i]}</span> ${opt}
    </button>`;
  }).join("");

  const explain = answered ? `<div class="explain-box">
      <b>${answered.correct ? "✅ 答對了！" : "❌ 再想想～"}</b><br>${q.e}
    </div>` : "";

  const title = isChallenge ? "🎲 綜合挑戰" : `${CONTENT[state.subject].icon} ${CONTENT[state.subject].label}篇 小測驗`;

  return `
  <div class="quiz-wrap">
    <div class="quiz-top">
      <div>
        <div style="font-weight:700; font-size:15px;">${title}</div>
        <div class="qcount">第 ${state.quizIdx+1} / ${state.quizQs.length} 題</div>
      </div>
      <div class="bubble-row">${bubbles}</div>
    </div>
    <div class="q-card">
      <span class="q-level">${levelTag}</span>
      <h3>${q.q}</h3>
      <div class="opt-list">${opts}</div>
      ${explain}
    </div>
    <div class="quiz-actions">
      <button class="btn-primary" data-action="next" ${answered?"":"disabled"}>${state.quizIdx===state.quizQs.length-1?"完成測驗":"下一題"}</button>
    </div>
  </div>`;
}

function quizResultHTML(){
  const { correct, total } = state.lastScore;
  const pct = Math.round((correct/total)*100);
  let msg = "再複習一下重點，你可以更好！";
  if(pct>=80) msg = "非常穩定，你已經抓到訣竅了！";
  else if(pct>=60) msg = "掌握得不錯，再加強易混淆的部分！";
  return `
  <div class="quiz-wrap quiz-result">
    <div style="font-size:13px; color:var(--ink-soft); font-weight:700;">測驗結果</div>
    <div class="score">${correct} / ${total}</div>
    <div class="msg">${msg}</div>
    <div class="result-actions">
      <button class="btn-ghost" data-action="backreview">📖 回去複習重點</button>
      <button class="btn-primary" data-action="retry">🔁 再測一次</button>
    </div>
  </div>`;
}

function footerHTML(){
  return `<footer>國中會考社會科複習站｜範圍：第一、二冊（七年級）｜基礎篇打底、進階篇拿高分</footer>`;
}

/* ---------- Event binding ---------- */
function bindEvents(){
  document.querySelectorAll('[data-action="subject"]').forEach(el=>{
    el.addEventListener('click', ()=> setSubject(el.dataset.subj));
  });
  document.querySelectorAll('[data-action="gohome-subject"]').forEach(el=>{
    el.addEventListener('click', ()=> goReview(el.dataset.subj, "basic"));
  });
  document.querySelectorAll('[data-action="level"]').forEach(el=>{
    el.addEventListener('click', ()=> setLevel(el.dataset.level));
  });
  document.querySelectorAll('[data-action="mode"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.mode==="review") goReview(state.subject, state.level);
      else startQuiz(state.subject, state.level);
    });
  });
  document.querySelectorAll('[data-action="challenge"]').forEach(el=>{
    el.addEventListener('click', startChallenge);
  });
  document.querySelectorAll('[data-action="pick"]').forEach(el=>{
    el.addEventListener('click', ()=> pickAnswer(parseInt(el.dataset.idx)));
  });
  const nextBtn = document.querySelector('[data-action="next"]');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
  const retryBtn = document.querySelector('[data-action="retry"]');
  if(retryBtn) retryBtn.addEventListener('click', ()=> startQuiz(state.subject, state.level));
  const backBtn = document.querySelector('[data-action="backreview"]');
  if(backBtn) backBtn.addEventListener('click', ()=> goReview(state.subject, state.level));
}

render();
</script>
</body>
</html>
